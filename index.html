<script type="text/babel" data-type="module" data-presets="react">
import { createRoot } from "react-dom/client";
import React, { useState, useMemo, useEffect, useRef, useContext, createContext } from "react";
import {
  Eye, EyeOff, Download, Upload, Plus, Trash2, Search, ChevronLeft, ChevronRight, X,
  Wallet, TrendingUp, TrendingDown, PiggyBank, CreditCard, Repeat, Layers, Pencil,
  LayoutDashboard, Receipt, BarChart3, Target, Settings, Sparkles, AlertTriangle, Calculator, FileSpreadsheet, CheckCircle2
} from "lucide-react";
import {
  ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, PieChart, Pie, Cell,
} from "recharts";

/* ───────────── Sabitler ───────────── */
const KEY = "nakit-akisi-v1";
const EXP_CATS = ["Yemek & Market", "Kira / Faturalar", "Ulaşım", "Dijital Abonelikler", "Eğlence", "Eğitim / Donanım", "Diğer"];
const INC_CATS = ["Maaş / Burs", "Ek Gelir", "Diğer Gelir"];
const METHODS = ["Nakit", "Kredi Kartı", "Banka Hesabı"];
const CAT_COLOR = {
  "Yemek & Market": "#60a5fa", "Kira / Faturalar": "#a78bfa", "Ulaşım": "#22d3ee",
  "Dijital Abonelikler": "#f472b6", "Eğlence": "#fb923c", "Eğitim / Donanım": "#2dd4bf", "Diğer": "#94a3b8",
};
const MODES = { single: "Tek Çekim", installment: "Taksitli", recurring: "Her Ay Tekrarlayan" };
const QUICK_TEMPLATES = [
  { title: "Market", category: "Yemek & Market", method: "Kredi Kartı", mode: "single" },
  { title: "Yemek / Sipariş", category: "Yemek & Market", method: "Kredi Kartı", mode: "single" },
  { title: "Kahve", category: "Eğlence", method: "Kredi Kartı", mode: "single" },
  { title: "Ulaşım / Akbil", category: "Ulaşım", method: "Banka Hesabı", mode: "single" },
  { title: "Taksi / Uber", category: "Ulaşım", method: "Kredi Kartı", mode: "single" },
];

/* ───────────── Yardımcılar ───────────── */
const PrivCtx = createContext(false);
const CardsCtx = createContext([]);
const pad = (n) => String(n).padStart(2, "0");
const fmt = (n) => new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 }).format(n || 0);
const fmt2 = (n) => new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }).format(n || 0);
const idx = (ym) => { const [y, m] = ym.split("-").map(Number); return y * 12 + m - 1; };
const addM = (ym, n) => { const i = idx(ym) + n; return `${Math.floor(i / 12)}-${pad((i % 12) + 1)}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const monthLabel = (ym) => new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 15).toLocaleDateString("tr-TR", { month: "long", year: "numeric" });
const monthShort = (ym) => new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 15).toLocaleDateString("tr-TR", { month: "short" });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const tarihTR = (t) => (t ? t.split("-").reverse().join(".") : "");
const addDay = (d) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + 1); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const gunText = (n) => (n < 0 ? `${-n} gün gecikti` : n === 0 ? "bugün" : `${n} gün kaldı`);
const dayIn = (ym, day) => `${ym}-${pad(Math.min(day, new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate()))}`;

/** Akıllı Doğal Dil Ayrıştırıcı (Örn: "Migros 850 kk", "Kulaklık 6000 6 taksit bonus") */
function parseSmartInput(text, cards) {
  const raw = text.trim();
  if (!raw) return null;
  const lower = raw.toLocaleLowerCase("tr");

  let installments = 1, mode = "single";
  const instMatch = lower.match(/(\d+)\s*(?:taksit|x)\b/);
  if (instMatch) {
    installments = Math.min(60, Math.max(2, parseInt(instMatch[1], 10)));
    mode = "installment";
  } else if (/\b(sabit|her ay|abonelik)\b/.test(lower)) {
    mode = "recurring";
  }

  const cleanedForAmt = raw.replace(/(\d+)\s*(?:taksit|x)\b/gi, "");
  const numMatches = [...cleanedForAmt.matchAll(/(\d+(?:[.,]\d{1,2})?)/g)];
  if (!numMatches.length) return null;
  const amtMatch = numMatches[numMatches.length - 1][1];
  const amount = parseFloat(amtMatch.replace(",", "."));
  if (!(amount > 0)) return null;

  let type = "expense";
  if (/\b(maaş|burs|gelir|freelance|ek ders|harçlık)\b/.test(lower)) type = "income";

  let method = mode === "installment" ? "Kredi Kartı" : "Kredi Kartı";
  let cardId = cards[0]?.id || undefined;
  if (/\b(nakit)\b/.test(lower)) { method = "Nakit"; cardId = undefined; }
  else if (/\b(banka|eft|havale|iban|hesap)\b/.test(lower) || type === "income") { method = "Banka Hesabı"; cardId = undefined; }
  else {
    for (const c of cards) {
      const words = c.name.toLocaleLowerCase("tr").split(/\s+/);
      if (words.some((w) => w.length > 2 && lower.includes(w))) { cardId = c.id; break; }
    }
  }

  let category = type === "income" ? "Maaş / Burs" : "Diğer";
  if (type === "income") {
    if (/\b(ek ders|freelance|proje|ek)\b/.test(lower)) category = "Ek Gelir";
  } else {
    if (/\b(migros|bim|a101|şok|market|yemek|getir|trendyol|kahve|kafe|restoran|fırın|su)\b/.test(lower)) category = "Yemek & Market";
    else if (/\b(kira|fatura|elektrik|doğalgaz|internet|turkcell|vodafone|telekom|aidat)\b/.test(lower)) category = "Kira / Faturalar";
    else if (/\b(taksi|uber|otobüs|metro|akbil|istanbulkart|bilet|benzin|yakıt|ulaşım|martı)\b/.test(lower)) category = "Ulaşım";
    else if (/\b(netflix|spotify|youtube|icloud|prime|chatgpt|claude|abonelik|oyun)\b/.test(lower)) category = "Dijital Abonelikler";
    else if (/\b(sinema|konser|tiyatro|bar|eğlence|gezi|tatil)\b/.test(lower)) category = "Eğlence";
    else if (/\b(kitap|kurs|eğitim|bilgisayar|kulaklık|klavye|mouse|telefon|donanım|udemy)\b/.test(lower)) category = "Eğitim / Donanım";
  }

  let title = raw
    .replace(amtMatch, "")
    .replace(/(\d+)\s*(?:taksit|x)\b/gi, "")
    .replace(/\b(kk|kredi kartı|nakit|banka|tl|₺|sabit|her ay)\b/gi, "")
    .replace(/\s+/g, " ")
    .trim();
  if (cards.length) {
    cards.forEach((c) => {
      c.name.split(/\s+/).forEach((w) => {
        if (w.length > 2) title = title.replace(new RegExp(`\\b${w}\\b`, "gi"), "").trim();
      });
    });
  }
  if (!title) title = category;
  title = title.charAt(0).toLocaleUpperCase("tr") + title.slice(1);

  return { id: uid(), type, title, amount, category, method, date: todayStr(), mode, installments, cardId: method === "Kredi Kartı" ? cardId : undefined };
}

function buildIcs(cards, today) {
  const cur = today.slice(0, 7), stamp = today.replace(/-/g, "") + "T000000Z";
  const ev = cards.map((c) => {
    const m = dayIn(cur, c.dueDay) >= today ? cur : addM(cur, 1);
    const start = dayIn(m, c.dueDay).replace(/-/g, "");
    const rule = c.dueDay > 28 ? "BYMONTHDAY=-1" : `BYMONTHDAY=${c.dueDay}`;
    const name = String(c.name).replace(/[,;\\\r\n]/g, " ");
    return ["BEGIN:VEVENT", `UID:${c.id}-son-odeme@nakit-akisi`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${start}`, `RRULE:FREQ=MONTHLY;${rule}`,
      `SUMMARY:💳 ${name} son ödeme günü`, "DESCRIPTION:Kart ekstresinin son ödeme günü. Ödemeyi unutmayın.",
      "BEGIN:VALARM", "TRIGGER:-PT15H", "ACTION:DISPLAY", "DESCRIPTION:Yarın kart son ödeme günü", "END:VALARM", "END:VEVENT"].join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Nakit Akisi//TR", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
}

const SEED_CARDS = [
  { id: "c1", name: "Garanti Bonus", cutDay: 15, dueDay: 25, limit: 120000 },
  { id: "c2", name: "Yapı Kredi World", cutDay: 5, dueDay: 15, limit: 40000 },
];
const SEED_GOALS = [
  { id: "g1", title: "Acil Durum Fonu", target: 50000, current: 18500 },
  { id: "g2", title: "Yeni Ekipman / Tatil", target: 30000, current: 12000 },
];

function occurrences(tx, ym) {
  const diff = idx(ym) - idx(tx.date.slice(0, 7));
  if (diff < 0) return [];
  if (tx.mode === "single") return diff === 0 ? [{ tx, amt: tx.amount }] : [];
  if (tx.mode === "installment") return diff < tx.installments ? [{ tx, amt: tx.amount / tx.installments, k: diff + 1, n: tx.installments }] : [];
  return [{ tx, amt: tx.amount }];
}
const monthOcc = (txs, ym) => txs.flatMap((t) => occurrences(t, ym));
const sumBy = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

/* ───────────── Örnek veri ───────────── */
function buildSeed() {
  let s = 20260101;
  const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const between = (a, b) => Math.round(a + rnd() * (b - a));
  const now = todayStr(), cur = now.slice(0, 7), out = [];
  const add = (o) => { if (o.date <= now || o.mode !== "single") out.push({ id: uid(), mode: "single", installments: 1, ...o }); };
  add({ type: "income", title: "Maaş / Burs", amount: 45000, category: "Maaş / Burs", method: "Banka Hesabı", date: dayIn(addM(cur, -6), 1), mode: "recurring" });
  add({ type: "expense", title: "Ev kirası", amount: 14500, category: "Kira / Faturalar", method: "Banka Hesabı", date: dayIn(addM(cur, -6), 3), mode: "recurring" });
  add({ type: "expense", title: "İnternet", amount: 489.9, category: "Kira / Faturalar", method: "Kredi Kartı", date: dayIn(addM(cur, -6), 12), mode: "recurring" });
  add({ type: "expense", title: "Elektrik & Su", amount: 850, category: "Kira / Faturalar", method: "Banka Hesabı", date: dayIn(addM(cur, -6), 15), mode: "recurring" });
  [["Spotify", 99.99, 8], ["Netflix", 229.99, 10], ["Amazon Prime", 59, 21], ["iCloud", 39.99, 5]].forEach(([title, amount, d]) =>
    add({ type: "expense", title, amount, category: "Dijital Abonelikler", method: "Kredi Kartı", date: dayIn(addM(cur, -6), d), mode: "recurring" }));
  add({ type: "expense", title: "Dizüstü bilgisayar", amount: 54000, category: "Eğitim / Donanım", method: "Kredi Kartı", date: dayIn(addM(cur, -2), 14), mode: "installment", installments: 12 });
  add({ type: "expense", title: "Kablosuz kulaklık", amount: 7200, category: "Eğitim / Donanım", method: "Kredi Kartı", date: dayIn(addM(cur, -1), 9), mode: "installment", installments: 6 });
  [[-4, "Ek ders", 6500], [-2, "Freelance proje", 4000], [-1, "Freelance proje", 8200]].forEach(([m, title, amount]) =>
    add({ type: "income", title, amount, category: "Ek Gelir", method: "Banka Hesabı", date: dayIn(addM(cur, m), 18) }));
  for (let m = -6; m <= 0; m++) {
    const ym = addM(cur, m);
    [2, 9, 16, 23].forEach((d) => add({ type: "expense", title: ["Migros", "BİM", "A101", "Şok"][between(0, 3)], amount: between(280, 1150), category: "Yemek & Market", method: rnd() > 0.5 ? "Kredi Kartı" : "Banka Hesabı", date: dayIn(ym, d) }));
    [5, 19].forEach((d) => add({ type: "expense", title: ["Yemeksepeti", "Getir Yemek", "Trendyol Yemek"][between(0, 2)], amount: between(170, 430), category: "Yemek & Market", method: "Kredi Kartı", date: dayIn(ym, d) }));
    add({ type: "expense", title: "Toplu taşıma dolumu", amount: between(450, 700), category: "Ulaşım", method: "Nakit", date: dayIn(ym, 4) });
    add({ type: "expense", title: ["Sinema", "Konser bileti", "Arkadaşlarla akşam"][between(0, 2)], amount: between(250, 900), category: "Eğlence", method: "Kredi Kartı", date: dayIn(ym, between(20, 27)) });
    if (m === -3) add({ type: "expense", title: "Online kurs", amount: 1850, category: "Eğitim / Donanım", method: "Kredi Kartı", date: dayIn(ym, 11) });
  }
  out.forEach((t) => { if (t.method === "Kredi Kartı") t.cardId = t.category === "Dijital Abonelikler" || t.title === "İnternet" ? "c2" : "c1"; });
  return out;
}
function loadStore() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && Array.isArray(r.txs)) return { cards: [], paid: {}, catBudgets: {}, goals: SEED_GOALS, ...r }; } catch (e) {}
  return { txs: buildSeed(), budget: 32000, priv: false, catBudgets: {}, cards: SEED_CARDS, paid: {}, goals: SEED_GOALS };
}

/* ───────────── Küçük bileşenler ───────────── */
const Money = ({ v, d2, className = "" }) => {
  const priv = useContext(PrivCtx);
  return <span className={`tabular-nums transition ${priv ? "blur-sm select-none" : ""} ${className}`}>{d2 ? fmt2(v) : fmt(v)}</span>;
};
const Card = ({ className = "", children, onClick }) => (
  <div onClick={onClick} role={onClick ? "button" : undefined} tabIndex={onClick ? 0 : undefined}
    className={`rounded-2xl border border-white/10 bg-zinc-900/60 backdrop-blur-md p-5 ${onClick ? "cursor-pointer transition hover:border-white/25 active:scale-[0.99]" : ""} ${className}`}>{children}</div>
);
const Go = () => <ChevronRight size={15} className="text-zinc-600" />;
const Label = ({ icon: I, children, tone = "text-zinc-400" }) => (
  <div className={`flex items-center gap-2 text-xs font-medium uppercase tracking-wider ${tone}`}>{I && <I size={14} />}{children}</div>
);
const inputCls = "w-full rounded-xl bg-zinc-900 border border-white/10 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-white/30 placeholder:text-zinc-600";
const ChartTip = ({ active, payload, label }) => {
  const priv = useContext(PrivCtx);
  if (!active || !payload?.length) return null;
  return (
    <div className="rounded-xl border border-white/10 bg-zinc-950/95 px-3 py-2 text-xs shadow-xl">
      <div className="mb-1 text-zinc-400">{label}</div>
      {payload.map((p) => <div key={p.dataKey} style={{ color: p.color || p.fill }} className={priv ? "blur-sm" : ""}>{p.name}: {fmt(p.value)}</div>)}
    </div>
  );
};

/* ───────────── İşlem ekleme penceresi ───────────── */
function AddModal({ onClose, onSave, onDelete, initial, cards }) {
  const [f, setF] = useState(initial ? { cardId: "", ...initial, amount: String(initial.amount) } : { cardId: cards[0]?.id || "", type: "expense", title: "", amount: "", category: EXP_CATS[0], method: METHODS[1], date: todayStr(), mode: "single", installments: 3 });
  const amtRef = useRef(null);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const setType = (t) => setF((p) => ({ ...p, type: t, category: t === "income" ? INC_CATS[0] : EXP_CATS[0], mode: t === "income" && p.mode === "installment" ? "single" : p.mode }));
  const applyTemplate = (tpl) => {
    setF((p) => ({ ...p, type: "expense", title: tpl.title, category: tpl.category, method: tpl.method, mode: tpl.mode, cardId: tpl.method === "Kredi Kartı" ? (p.cardId || cards[0]?.id || "") : "" }));
    setTimeout(() => amtRef.current?.focus(), 50);
  };
  const valid = f.title.trim() && +f.amount > 0 && f.date;
  useEffect(() => { const h = (e) => e.key === "Escape" && onClose(); window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  const submit = (e) => {
    e.preventDefault(); if (!valid) return;
    onSave({ id: initial?.id || uid(), type: f.type, title: f.title.trim(), amount: +f.amount, category: f.category, method: f.method, date: f.date, mode: f.mode, installments: f.mode === "installment" ? +f.installments : 1, cardId: f.method === "Kredi Kartı" && f.cardId ? f.cardId : undefined });
  };
  const per = f.mode === "installment" && +f.amount > 0 ? +f.amount / +f.installments : 0;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-0 sm:p-4" onClick={onClose}>
      <form onSubmit={submit} onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md max-h-[92vh] overflow-auto rounded-t-3xl sm:rounded-3xl border border-white/10 bg-zinc-950 p-5 shadow-2xl" style={{ paddingBottom: "calc(20px + env(safe-area-inset-bottom))" }}>
        <div className="mb-3 flex items-center justify-between"><h2 className="text-lg font-semibold">{initial ? "İşlemi Düzenle" : "Yeni İşlem"}</h2>
          <button type="button" onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 hover:bg-white/10"><X size={18} /></button></div>
        {!initial && (
          <div className="mb-3">
            <div className="mb-1.5 text-[11px] text-zinc-500">Hızlı Şablonlar (dokun ve sadece tutar gir)</div>
            <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
              {QUICK_TEMPLATES.map((tpl) => (
                <button key={tpl.title} type="button" onClick={() => applyTemplate(tpl)} className="shrink-0 rounded-lg border border-white/10 bg-zinc-900 px-2.5 py-1.5 text-xs text-zinc-300 transition hover:border-white/30 active:scale-95">
                  ⚡ {tpl.title}
                </button>
              ))}
            </div>
          </div>
        )}
        <div className="mb-4 grid grid-cols-2 gap-1 rounded-xl bg-zinc-900 p-1">
          {[["expense", "Gider", "bg-rose-400/20 text-rose-300"], ["income", "Gelir", "bg-emerald-400/20 text-emerald-300"]].map(([t, l, c]) => (
            <button key={t} type="button" onClick={() => setType(t)} className={`rounded-lg py-2 text-sm font-medium transition ${f.type === t ? c : "text-zinc-500"}`}>{l}</button>))}
        </div>
        <div className="space-y-3">
          <input autoFocus className={inputCls} placeholder="Açıklama (örn. Migros, Kira)" value={f.title} onChange={(e) => set("title", e.target.value)} />
          <div className="grid grid-cols-2 gap-3">
            <input ref={amtRef} className={inputCls} type="number" inputMode="decimal" step="0.01" min="0" placeholder={f.mode === "installment" ? "Toplam tutar ₺" : "Tutar ₺"} value={f.amount} onChange={(e) => set("amount", e.target.value)} />
            <input className={inputCls} type="date" value={f.date} onChange={(e) => set("date", e.target.value)} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <select className={inputCls} value={f.category} onChange={(e) => set("category", e.target.value)}>{(f.type === "income" ? INC_CATS : EXP_CATS).map((c) => <option key={c}>{c}</option>)}</select>
            <select className={inputCls} value={f.method} onChange={(e) => set("method", e.target.value)}>{METHODS.map((c) => <option key={c}>{c}</option>)}</select>
          </div>
          {f.method === "Kredi Kartı" && (cards.length > 0
            ? <select className={inputCls} value={f.cardId} onChange={(e) => set("cardId", e.target.value)}>{cards.map((c) => <option key={c.id} value={c.id}>{c.name} (ekstre {c.cutDay}., son ödeme {c.dueDay}.)</option>)}</select>
            : <div className="text-xs text-zinc-500">Hangi karta ait olduğunu seçmek için önce Kart sekmesinden kart ekleyin.</div>)}
          <div>
            <div className="mb-1.5 text-xs text-zinc-500">Ödeme şekli</div>
            <div className={`grid gap-1 rounded-xl bg-zinc-900 p-1 ${f.type === "income" ? "grid-cols-2" : "grid-cols-3"}`}>
              {Object.entries(MODES).filter(([k]) => f.type === "expense" || k !== "installment").map(([k, l]) => (
                <button key={k} type="button" onClick={() => set("mode", k)} className={`rounded-lg px-1 py-2 text-xs font-medium transition ${f.mode === k ? (k === "recurring" ? "bg-amber-400/20 text-amber-300" : "bg-white/10 text-white") : "text-zinc-500"}`}>{l}</button>))}
            </div>
          </div>
          {f.mode === "installment" && (

                  <button key={n} type="button" onClick={() => set("installments", n)} className={`rounded-lg px-3 py-1.5 text-xs font-medium ${+f.installments === n ? "bg-white text-zinc-900" : "bg-zinc-800 text-zinc-400"}`}>{n}x</button>))}

                <input type="number" inputMode="numeric" min="2" max="60" value={f.installments} onChange={(e) => set("installments", Math.min(60, Math.max(2, Math.round(+e.target.value) || 2)))} className="w-20 rounded-lg border border-white/10 bg-zinc-900 px-2 py-1.5 text-center text-sm text-white outline-none focus:border-white/30" /> taksit</div>
              <div className="text-xs text-zinc-400">{+f.installments} taksit{per > 0 && <> · aylık <span className="font-semibold text-zinc-200">{fmt2(per)}</span></>}</div>
            </div>)}
          {f.mode === "recurring" && <div className="rounded-xl border border-amber-400/20 bg-amber-400/5 p-3 text-xs text-amber-200/80">Bu işlem seçilen tarihten itibaren her ay otomatik olarak yansır.</div>}

        {initial && <button type="button" onClick={onDelete} className="mt-2 w-full rounded-xl border border-rose-400/30 py-2.5 text-sm font-medium text-rose-300 hover:bg-rose-400/10">Sil</button>}
      </form>
    </div>
  );
}

function CardModal({ initial, onClose, onSave, onDelete }) {
  const [f, setF] = useState(initial ? { ...initial, limit: String(initial.limit || "") } : { name: "", cutDay: 15, dueDay: 25, limit: "" });
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const day = (v) => Math.min(31, Math.max(1, Math.round(+v) || 1));
  const valid = f.name.trim();
  useEffect(() => { const h = (e) => e.key === "Escape" && onClose(); window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <form onSubmit={(e) => { e.preventDefault(); if (valid) onSave({ id: initial?.id || uid(), name: f.name.trim(), cutDay: day(f.cutDay), dueDay: day(f.dueDay), limit: Math.max(0, +f.limit || 0) }); }}
        onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border border-white/10 bg-zinc-950 p-5 shadow-2xl" style={{ paddingBottom: "calc(20px + env(safe-area-inset-bottom))" }}>
        <div className="mb-4 flex items-center justify-between"><h2 className="text-lg font-semibold">{initial ? "Kartı Düzenle" : "Yeni Kart"}</h2>
          <button type="button" onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 hover:bg-white/10"><X size={18} /></button></div>
        <div className="space-y-3">
          <input autoFocus className={inputCls} placeholder="Kart adı (örn. Garanti Bonus)" value={f.name} onChange={(e) => set("name", e.target.value)} />
          <div className="grid grid-cols-2 gap-3">
            <div><div className="mb-1 text-xs text-zinc-500">Ekstre kesim günü</div><input className={inputCls} type="number" inputMode="numeric" min="1" max="31" value={f.cutDay} onChange={(e) => set("cutDay", e.target.value)} /></div>
            <div><div className="mb-1 text-xs text-zinc-500">Son ödeme günü</div><input className={inputCls} type="number" inputMode="numeric" min="1" max="31" value={f.dueDay} onChange={(e) => set("dueDay", e.target.value)} /></div>
          </div>
          <div><div className="mb-1 text-xs text-zinc-500">Kart limiti ₺ (asgari ödeme hesabı için)</div><input className={inputCls} type="number" inputMode="decimal" value={f.limit} onChange={(e) => set("limit", e.target.value)} /></div>
          <div className="text-xs text-zinc-500">Ekstre kesim günü, bankanın ekstreyi oluşturduğu gündür. O günden sonraki harcamalar bir sonraki ekstreye girer.</div>
        </div>
        <button disabled={!valid} className="mt-5 w-full rounded-xl bg-white py-2.5 text-sm font-semibold text-zinc-900 disabled:opacity-30">Kaydet</button>
        {initial && <button type="button" onClick={onDelete} className="mt-2 w-full rounded-xl border border-rose-400/30 py-2.5 text-sm font-medium text-rose-300 hover:bg-rose-400/10">Kartı Sil</button>}
      </form>
    </div>
  );
}

function App() {
  const init = useMemo(loadStore, []);
  const [txs, setTxs] = useState(init.txs);
  const [budget, setBudget] = useState(init.budget ?? 32000);
  const [catBudgets, setCatBudgets] = useState(init.catBudgets || {});
  const [cards, setCards] = useState(init.cards || []);
  const [paid, setPaid] = useState(init.paid || {});
  const [goals, setGoals] = useState(init.goals || SEED_GOALS);
  const [cardModal, setCardModal] = useState(null);
  const [priv, setPriv] = useState(!!init.priv);
  const [ym, setYm] = useState(todayStr().slice(0, 7));
  const [tab, setTabRaw] = useState(hashTab);
  const [modal, setModal] = useState(null);
  const [q, setQ] = useState("");
  const [fCat, setFCat] = useState("Tümü");
  const [fMethod, setFMethod] = useState("Tümü");
  const [allMonths, setAllMonths] = useState(false);
  const [editBudget, setEditBudget] = useState(false);
  const [smartText, setSmartText] = useState("");
  const [smartToast, setSmartToast] = useState(null);
  const [simAmt, setSimAmt] = useState("");
  const [simInst, setSimInst] = useState(6);
  const [newGoal, setNewGoal] = useState({ title: "", target: "" });
  const fileRef = useRef(null);

  const setTab = (t) => { setTabRaw(t); try { window.history.replaceState(null, "", "#/" + t); } catch (e) {} window.scrollTo(0, 0); };
  const goTo = (t, o = {}) => { if (o.cat !== undefined) { setFCat(o.cat); setAllMonths(false); setQ(""); setFMethod("Tümü"); } setTab(t); };
  useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ txs, budget, priv, catBudgets, cards, paid, goals })); }, [txs, budget, priv, catBudgets, cards, paid, goals]);
  useEffect(() => { const h = () => setTabRaw(hashTab()); window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);

  /* hesaplamalar */
  const occ = useMemo(() => monthOcc(txs, ym), [txs, ym]);
  const expOcc = occ.filter((o) => o.tx.type === "expense");
  const inc = sumBy(occ.filter((o) => o.tx.type === "income"), (o) => o.amt);
  const exp = sumBy(expOcc, (o) => o.amt);
  const net = inc - exp;
  const saveRate = inc > 0 ? (net / inc) * 100 : 0;
  const remaining = budget - exp;
  const usedPct = budget > 0 ? Math.min(100, (exp / budget) * 100) : 0;
  const catSum = (list) => { const m = {}; list.forEach((o) => { m[o.tx.category] = (m[o.tx.category] || 0) + o.amt; }); return m; };
  const catNow = useMemo(() => catSum(expOcc), [occ]);
  const catPrev = useMemo(() => catSum(monthOcc(txs, addM(ym, -1)).filter((o) => o.tx.type === "expense")), [txs, ym]);
  const pie = Object.entries(catNow).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);

  const monthsBack = (n) => Array.from({ length: n }, (_, i) => addM(ym, i - (n - 1)));
  const series = (n) => monthsBack(n).map((m) => { const o = monthOcc(txs, m); const g = sumBy(o.filter((x) => x.tx.type === "income"), (x) => x.amt), d = sumBy(o.filter((x) => x.tx.type === "expense"), (x) => x.amt); return { name: monthShort(m), Gelir: Math.round(g), Gider: Math.round(d), Net: Math.round(g - d) }; });
  const six = useMemo(() => series(6), [txs, ym]);
  const twelve = useMemo(() => series(12), [txs, ym]);

  const instAll = txs.filter((t) => t.type === "expense" && t.mode === "installment");
  const instInfo = instAll.map((t) => {
    const start = t.date.slice(0, 7), per = t.amount / t.installments;
    const paidCnt = Math.min(t.installments, Math.max(0, idx(ym) - idx(start) + 1));
    return { t, per, paid: paidCnt, left: t.installments - paidCnt, remain: per * (t.installments - paidCnt), end: addM(start, t.installments - 1), started: idx(ym) >= idx(start) };
  });
  const activeInst = instInfo.filter((x) => x.left > 0);
  const totalDebt = sumBy(activeInst, (x) => x.remain);
  const thisMonthInst = sumBy(monthOcc(instAll, ym), (x) => x.amt);
  const future = (n, from) => Array.from({ length: n }, (_, i) => { const m = addM(ym, i + from); return { name: monthShort(m), Taksit: Math.round(sumBy(monthOcc(instAll, m), (x) => x.amt)) }; });
  const future6 = useMemo(() => future(6, 1), [txs, ym]);
  const future12 = useMemo(() => future(12, 0), [txs, ym]);

  const fixedExp = expOcc.filter((o) => o.tx.mode === "recurring");
  const fixedInc = occ.filter((o) => o.tx.type === "income" && o.tx.mode === "recurring");
  const fixedTotal = sumBy(fixedExp, (o) => o.amt), fixedIncTotal = sumBy(fixedInc, (o) => o.amt);

  const rows = useMemo(() => {
    const base = allMonths ? txs.map((tx) => ({ tx, amt: tx.amount, all: true, date: tx.date })) : occ.map((o) => ({ ...o, date: dayIn(ym, +o.tx.date.slice(8)) }));
    const s = q.trim().toLocaleLowerCase("tr");
    return base.filter((r) => (fCat === "Tümü" || r.tx.category === fCat) && (fMethod === "Tümü" || r.tx.method === fMethod) && (!s || r.tx.title.toLocaleLowerCase("tr").includes(s) || r.tx.category.toLocaleLowerCase("tr").includes(s)))
      .sort((a, b) => b.date.localeCompare(a.date));
  }, [txs, occ, ym, q, fCat, fMethod, allMonths]);
  const grouped = [];
  rows.forEach((r) => { if (grouped[grouped.length - 1]?.k !== r.date) grouped.push({ k: r.date, items: [] }); grouped[grouped.length - 1].items.push(r); });
  const dayFmt = (d) => new Date(d + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "short" });
  const blur = priv ? "blur-sm select-none" : "";

  /* eylemler */
  const del = (tx) => {
    const seri = tx.mode !== "single";
    if (window.confirm(seri ? `"${tx.title}" serisinin TÜM aylardaki kayıtları silinecek. Emin misiniz?` : `"${tx.title}" silinsin mi?`)) { setTxs((p) => p.filter((x) => x.id !== tx.id)); setModal(null); }
  };
  const save = (tx) => { setTxs((p) => (p.some((x) => x.id === tx.id) ? p.map((x) => (x.id === tx.id ? tx : x)) : [...p, tx])); setYm(tx.date.slice(0, 7)); setModal(null); };
  const handleSmartSubmit = (e) => {
    e.preventDefault();
    const parsed = parseSmartInput(smartText, cards);
    if (!parsed) return;
    setTxs((p) => [...p, parsed]);
    setSmartText("");
    setSmartToast(`${parsed.title} (${fmt2(parsed.amount)}${parsed.mode === "installment" ? ` · ${parsed.installments}x` : ""}) eklendi!`);
    setTimeout(() => setSmartToast(null), 3500);
  };
  const exportJson = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ txs, budget, catBudgets, cards, paid, goals }, null, 2)], { type: "application/json" }));
    a.download = `nakit-akisi-yedek-${todayStr()}.json`; a.click();
  };
  const exportCsv = () => {
    const headers = ["Tarih", "Tür", "Açıklama", "Kategori", "Yöntem", "Mod", "Taksit", "Toplam Tutar"];
    const csvRows = [headers.join(";")];
    [...txs].sort((a, b) => b.date.localeCompare(a.date)).forEach((t) => {
      csvRows.push([t.date, t.type === "income" ? "Gelir" : "Gider", `"${t.title.replace(/"/g, '""')}"`, t.category, t.method, MODES[t.mode] || t.mode, t.installments || 1, String(t.amount).replace(".", ",")].join(";"));
    });
    const blob = new Blob(["\uFEFF" + csvRows.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `nakit-akisi-tablo-${todayStr()}.csv`;
    a.click();
  };
  const importJson = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.txs) || !d.txs.every((t) => t.id && t.date && t.amount >= 0 && t.mode)) throw new Error();
        if (window.confirm("Mevcut veriler silinip yedekteki veriler yüklenecek. Emin misiniz?")) { setTxs(d.txs); if (d.budget) setBudget(+d.budget); setCatBudgets(d.catBudgets || {}); setCards(d.cards || []); setPaid(d.paid || {}); if (d.goals) setGoals(d.goals); }
      } catch { window.alert("Geçersiz yedek dosyası."); }
    };
    r.readAsText(file); e.target.value = "";
  };
  const clearAll = () => { if (window.confirm("TÜM veriler (örnek veriler dahil) silinecek. Önce yedek almanızı öneririz. Devam edilsin mi?")) { setTxs([]); setCards([]); setPaid({}); setGoals([]); } };
  const loadSample = () => { if (window.confirm("Mevcut veriler silinip örnek veriler yüklenecek. Emin misiniz?")) { setTxs(buildSeed()); setCards(SEED_CARDS); setPaid({}); setGoals(SEED_GOALS); } };

  /* Gerçek Banka Ekstresi & BDDK Asgari Ödeme Motoru */
  const cardStats = (card) => {
    const today = todayStr(), cur = today.slice(0, 7);
    const mCur = today <= dayIn(cur, card.cutDay) ? cur : addM(cur, 1);
    const cardTxs = txs.filter((t) => t.type === "expense" && t.cardId === card.id);
    const txStmtMonth = (dStr) => {
      const ym0 = dStr.slice(0, 7);
      return dStr <= dayIn(ym0, card.cutDay) ? ym0 : addM(ym0, 1);
    };
    const stmt = (m) => {
      const end = dayIn(m, card.cutDay), prevEnd = dayIn(addM(m, -1), card.cutDay), start = addDay(prevEnd);
      const due = card.dueDay > card.cutDay ? dayIn(m, card.dueDay) : dayIn(addM(m, 1), card.dueDay);
      const items = [];
      cardTxs.forEach((tx) => {
        const firstM = txStmtMonth(tx.date);
        const diff = idx(m) - idx(firstM);
        if (diff < 0) return;
        if (tx.mode === "single" && diff === 0) items.push({ tx, amt: tx.amount, date: tx.date });
        else if (tx.mode === "installment" && diff < tx.installments) items.push({ tx, amt: tx.amount / tx.installments, k: diff + 1, n: tx.installments, date: diff === 0 ? tx.date : dayIn(m, Math.min(+tx.date.slice(8), card.cutDay)) });
        else if (tx.mode === "recurring") {
          const d = dayIn(m, +tx.date.slice(8));
          const occD = d >= start && d <= end ? d : dayIn(addM(m, -1), +tx.date.slice(8));
          if (occD >= tx.date) items.push({ tx, amt: tx.amount, date: occD });
        }
      });
      items.sort((a, b) => b.date.localeCompare(a.date));
      const total = sumBy(items, (o) => o.amt);
      const minRate = (card.limit || 0) > 50000 ? 0.40 : 0.20;
      const minPay = Math.round(total * minRate);
      return { m, end, start, due, items, total, minPay, minRate, key: card.id + ":" + m };
    };
    const curS = stmt(mCur), prevS = stmt(addM(mCur, -1));
    const isPaid = !!paid[prevS.key];
    let futureInst = 0;
    cardTxs.filter((t) => t.mode === "installment").forEach((tx) => {
      const firstM = txStmtMonth(tx.date);
      const passed = idx(mCur) - idx(firstM) + 1;
      const remCount = Math.max(0, tx.installments - Math.max(0, passed));
      futureInst += (tx.amount / tx.installments) * remCount;
    });
    const used = (isPaid ? 0 : prevS.total) + curS.total + futureInst;
    return { card, curS, prevS, isPaid, future: futureInst, used, daysToCut: daysBetween(today, curS.end), daysToDue: daysBetween(today, prevS.due) };
  };
  const cardSt = cards.map(cardStats);
  const addToCalendar = async () => {
    const file = new File([buildIcs(cards, todayStr())], "kart-son-odeme.ics", { type: "text/calendar" });
    try { if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: "Kart son ödeme hatırlatmaları" }); return; } }
    catch (e) { if (e?.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = "kart-son-odeme.ics"; a.click();
  };
  const dueTone = (n) => (n <= 3 ? "text-rose-400" : n <= 7 ? "text-amber-400" : "text-zinc-400");

  /* Akıllı Uyarılar */
  const alerts = [];
  cardSt.forEach((s) => {
    if (!s.isPaid && s.prevS.total > 0 && s.daysToDue <= 5) {
      alerts.push({ id: s.card.id, tone: "rose", text: `${s.card.name} ekstresi (${fmt(s.prevS.total)}) son ödeme: ${gunText(s.daysToDue)}!`, action: () => setTab("kart") });
    }
  });
  if (usedPct >= 85) {
    alerts.push({ id: "budget", tone: usedPct >= 100 ? "rose" : "amber", text: usedPct >= 100 ? `Aylık bütçe hedefini ${fmt(exp - budget)} aştınız.` : `Aylık bütçenin %${Math.round(usedPct)}'ine ulaştınız.`, action: () => setTab("butce") });
  }

  /* ───── Sekme içerikleri ───── */
  const Ozet = () => (
    <div className="grid grid-cols-1 gap-4 lg:grid-cols-6">
      {/* Doğal Dil Hızlı Giriş Çubuğu */}
      <div className="lg:col-span-6">
        <form onSubmit={handleSmartSubmit} className="relative flex items-center gap-2 rounded-2xl border border-emerald-400/25 bg-zinc-900/90 p-2 shadow-lg">
          <Sparkles size={18} className="ml-2 shrink-0 text-emerald-400" />
          <input
            value={smartText}
            onChange={(e) => setSmartText(e.target.value)}
            placeholder='Hızlı yaz ekle: "Migros 450" veya "Kulaklık 6000 6 taksit"'
            className="w-full bg-transparent text-sm text-zinc-100 outline-none placeholder:text-zinc-500"
          />
          <button type="submit" disabled={!smartText.trim()} className="shrink-0 rounded-xl bg-emerald-400 px-3.5 py-2 text-xs font-semibold text-zinc-950 transition hover:bg-emerald-300 disabled:opacity-30">Ekle</button>
        </form>
        {smartToast && (
          <div className="mt-2 flex items-center gap-2 rounded-xl border border-emerald-400/30 bg-emerald-400/10 px-3 py-2 text-xs text-emerald-300">
            <CheckCircle2 size={15} /> {smartToast}
          </div>
        )}
      </div>

      {/* Akıllı Uyarılar */}
      {alerts.length > 0 && (
        <div className="lg:col-span-6 space-y-2">
          {alerts.map((a) => (
            <div key={a.id} onClick={a.action} className={`flex cursor-pointer items-center justify-between rounded-xl border px-4 py-2.5 text-xs font-medium ${a.tone === "rose" ? "border-rose-400/30 bg-rose-400/10 text-rose-300" : "border-amber-400/30 bg-amber-400/10 text-amber-300"}`}>

                  </div>
                </div>
                <div className="mt-2 h-2 overflow-hidden rounded-full bg-white/10"><div className="h-full rounded-full bg-emerald-400 transition-all" style={{ width: `${pct}%` }} /></div>
                <div className="mt-1.5 flex justify-between text-xs text-zinc-400">
                  <span>Biriken: <Money v={g.current} /> (%{pct})</span>
                  <span>Hedef: <Money v={g.target} /></span>
                </div>
              </div>
            );
          })}
          <form onSubmit={(e) => { e.preventDefault(); if (!newGoal.title.trim() || !(+newGoal.target > 0)) return; setGoals((p) => [...p, { id: uid(), title: newGoal.title.trim(), target: +newGoal.target, current: 0 }]); setNewGoal({ title: "", target: "" }); }} className="grid grid-cols-1 gap-2 sm:grid-cols-3 pt-1">
            <input placeholder="Yeni hedef adı (örn. Tatil)" value={newGoal.title} onChange={(e) => setNewGoal((p) => ({ ...p, title: e.target.value }))} className={inputCls} />
            <input type="number" inputMode="decimal" placeholder="Hedef tutar ₺" value={newGoal.target} onChange={(e) => setNewGoal((p) => ({ ...p, target: e.target.value }))} className={inputCls} />
            <button type="submit" className="rounded-xl border border-white/15 bg-white/5 py-2 text-xs font-semibold text-zinc-200 hover:bg-white/10">+ Hedef Ekle</button>
          </form>
        </div>
      </Card>

      <Card><Label icon={Target}>Kategori Limitleri</Label><div className="mt-1 text-xs text-zinc-500">Limit yazın, harcama o limite yaklaştıkça renk değiştirir. Boş bırakırsanız limit yok.</div>
        <div className="mt-4 space-y-5">{EXP_CATS.map((c) => {
          const spent = catNow[c] || 0, lim = +catBudgets[c] || 0, p = lim > 0 ? (spent / lim) * 100 : 0;
          return (<div key={c + "-" + lim}><div className="flex items-center justify-between gap-3"><span className="flex items-center gap-2 text-sm"><span className="h-2.5 w-2.5 rounded-full" style={{ background: CAT_COLOR[c] }} />{c}</span>
            <input type="number" inputMode="decimal" placeholder="Limit ₺" defaultValue={lim || ""} onBlur={(e) => setCatBudgets((p0) => ({ ...p0, [c]: Math.max(0, +e.target.value || 0) }))} className="w-28 rounded-lg border border-white/10 bg-zinc-900 px-2 py-1.5 text-right text-sm outline-none focus:border-white/30" /></div>
            <div className="mt-2 h-2 overflow-hidden rounded-full bg-white/10"><div className={`h-full rounded-full ${p >= 100 ? "bg-rose-400" : p >= 80 ? "bg-amber-400" : "bg-emerald-400"}`} style={{ width: `${Math.min(100, lim ? p : 0)}%` }} /></div>
            <div className="mt-1 flex justify-between text-xs text-zinc-500"><span>Harcanan <Money v={spent} /></span><span>{lim > 0 ? (p >= 100 ? <span className="text-rose-400">Limit aşıldı</span> : <>Kalan <Money v={lim - spent} /></>) : "Limit yok"}</span></div></div>);
        })}</div></Card>
    </div>
  );

  const Ayar = () => (
    <div className="space-y-4">
      <Card><Label>Yedekleme & Dışa Aktarma</Label><div className="mt-1 text-xs text-zinc-500">Veriler yalnızca bu cihazda saklanır. Haftada bir yedek alın veya Excel için CSV indirin.</div>
        <div className="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
          <button onClick={exportJson} className="flex items-center justify-center gap-2 rounded-xl bg-white py-3 text-sm font-semibold text-zinc-900"><Download size={16} />JSON İndir (Yedek)</button>
          <button onClick={() => fileRef.current?.click()} className="flex items-center justify-center gap-2 rounded-xl border border-white/15 py-3 text-sm font-medium"><Upload size={16} />JSON Yükle</button>
          <button onClick={exportCsv} className="flex items-center justify-center gap-2 rounded-xl border border-emerald-400/30 bg-emerald-400/10 py-3 text-sm font-medium text-emerald-300"><FileSpreadsheet size={16} />Excel (CSV) İndir</button>
        </div></Card>
      <Card><Label>Gizlilik Modu</Label>
        <button onClick={() => setPriv(!priv)} className="mt-3 flex w-full items-center justify-between rounded-xl border border-white/10 px-4 py-3 text-sm"><span className="flex items-center gap-2">{priv ? <EyeOff size={16} /> : <Eye size={16} />}Rakamları bulanıklaştır</span>
          <span className={`rounded-full px-2.5 py-0.5 text-xs ${priv ? "bg-emerald-400/20 text-emerald-300" : "bg-white/10 text-zinc-400"}`}>{priv ? "Açık" : "Kapalı"}</span></button></Card>
      <Card><Label>Veri</Label>
        <div className="mt-3 space-y-2"><button onClick={loadSample} className="w-full rounded-xl border border-white/10 py-3 text-sm text-zinc-300">Örnek verileri yükle</button>
          <button onClick={clearAll} className="w-full rounded-xl border border-rose-400/30 py-3 text-sm text-rose-300">Tüm verileri sil</button></div>
        <div className="mt-3 text-xs text-zinc-600">{txs.length} kayıt · veriler bu cihazın tarayıcısında saklanır.</div></Card>
    </div>
  );

  const Kart = () => {
    const totalDue = sumBy(cardSt.filter((s) => !s.isPaid), (s) => s.prevS.total);
    return (
      <div className="space-y-4">
        <div className="grid grid-cols-2 gap-4">
          <Card><Label icon={CreditCard}>Ödenecek Ekstre</Label><div className="mt-2 text-3xl font-semibold text-rose-300"><Money v={totalDue} /></div><div className="mt-1 text-xs text-zinc-500">kesilmiş, ödenmemiş</div></Card>
          <Card><Label>Toplam Kart Borcu</Label><div className="mt-2 text-3xl font-semibold"><Money v={sumBy(cardSt, (s) => s.used)} /></div><div className="mt-1 text-xs text-zinc-500">ekstre + dönem + kalan taksit</div></Card>
        </div>
        {cardSt.length === 0 && <Card><div className="py-6 text-center text-sm text-zinc-500">Henüz kart yok. Ekstre kesim ve son ödeme günlerini girerek başlayın.</div></Card>}
        {cardSt.map((s) => { const lim = +s.card.limit || 0, pct = lim > 0 ? Math.min(100, (s.used / lim) * 100) : 0; return (
          <Card key={s.card.id}>
            <div className="flex items-start justify-between">
              <div><div className="flex items-center gap-2 font-medium"><CreditCard size={16} className="text-zinc-400" />{s.card.name}</div>
                <div className="mt-1 text-xs text-zinc-500">Ekstre kesim: her ayın {s.card.cutDay}. günü · Son ödeme: {s.card.dueDay}. günü</div></div>
              <button onClick={() => setCardModal(s.card)} className="rounded-lg p-2 text-zinc-400 hover:bg-white/10 hover:text-white" aria-label="Kartı düzenle"><Pencil size={15} /></button>
            </div>
            {lim > 0 && (<div className="mt-4"><div className="h-2 overflow-hidden rounded-full bg-white/10"><div className={`h-full rounded-full ${pct >= 90 ? "bg-rose-400" : pct >= 70 ? "bg-amber-400" : "bg-emerald-400"}`} style={{ width: `${pct}%` }} /></div>
              <div className="mt-1.5 flex justify-between text-xs text-zinc-500"><span>Kullanılan <Money v={s.used} /></span><span>Kullanılabilir <Money v={Math.max(0, lim - s.used)} /> / <Money v={lim} /></span></div></div>)}
            <div className="mt-4 rounded-xl bg-white/[0.03] p-3">
              <div className="text-xs text-zinc-500">Ödenecek ekstre · {tarihTR(s.prevS.start)} – {tarihTR(s.prevS.end)}</div>
              {s.prevS.total === 0 ? <div className="mt-1 text-sm text-zinc-500">Ödenecek ekstre yok.</div> : (
                <div className="mt-1 flex items-end justify-between gap-3">
                  <div><div className={`text-2xl font-semibold ${s.isPaid ? "text-zinc-500 line-through" : "text-rose-300"}`}><Money v={s.prevS.total} /></div>
                    {!s.isPaid && <div className="text-[11px] text-zinc-400">Asgari ödeme (%{Math.round(s.prevS.minRate * 100)}): <Money v={s.prevS.minPay} /></div>}
                    <div className={`mt-0.5 text-xs ${s.isPaid ? "text-emerald-400" : dueTone(s.daysToDue)}`}>{s.isPaid ? "Ödendi ✓" : `Son ödeme ${tarihTR(s.prevS.due)} · ${gunText(s.daysToDue)}`}</div></div>
                  <button onClick={() => setPaid((p) => ({ ...p, [s.prevS.key]: !p[s.prevS.key] }))} className={`rounded-lg px-3 py-2 text-xs font-semibold ${s.isPaid ? "border border-white/15 text-zinc-300" : "bg-white text-zinc-900"}`}>{s.isPaid ? "Geri al" : "Ödendi"}</button>
                </div>)}
            </div>
            <div className="mt-3 rounded-xl bg-white/[0.03] p-3">
              <div className="text-xs text-zinc-500">Güncel dönem · {tarihTR(s.curS.start)} – {tarihTR(s.curS.end)}</div>
              <div className="mt-1 flex items-end justify-between"><div className="text-2xl font-semibold"><Money v={s.curS.total} /></div>
                <div className="text-right text-xs text-zinc-500">Ekstre {tarihTR(s.curS.end)}<br />{gunText(s.daysToCut)}</div></div>
              {s.future > 0 && <div className="mt-2 text-xs text-violet-300">Sonraki dönemlere kalan taksit: <Money v={s.future} /></div>}
            </div>
            {s.curS.items.length > 0 && (<div className="-mx-5 mt-3 border-b border-white/5">{s.curS.items.slice(0, 5).map((o, i) => <TxRow key={o.tx.id + i} r={o} onOpen={setModal} onDel={del} />)}
              {s.curS.items.length > 5 && <div className="border-t border-white/5 px-5 py-2 text-xs text-zinc-500">+{s.curS.items.length - 5} işlem daha…</div>}</div>)}
          </Card>); })}
        <button onClick={() => setCardModal("new")} className="w-full rounded-2xl border border-dashed border-white/15 py-4 text-sm text-zinc-300 transition hover:bg-white/5">+ Kart ekle</button>
        {cards.length > 0 && (<div>
          <button onClick={addToCalendar} className="w-full rounded-2xl border border-white/10 bg-zinc-900/60 py-3.5 text-sm text-zinc-200 transition hover:bg-white/5">📅 Son ödeme hatırlatmalarını Takvim'e ekle</button>
          <div className="mt-2 px-1 text-xs text-zinc-600">Her ay, son ödeme gününden 1 gün önce saat 09:00'da hatırlatır. Kart günlerini değiştirirseniz eski etkinlikleri Takvim'den silip yeniden ekleyin.</div></div>)}
      </div>
    );
  };

  const content = { ozet: Ozet, islemler: Islemler, taksit: Taksit, kart: Kart, sabit: Sabit, analiz: Analiz, butce: Butce, ayar: Ayar }[tab];

  return (
    <PrivCtx.Provider value={priv}>
      <CardsCtx.Provider value={cards}>
      <div className="min-h-screen bg-zinc-950 text-zinc-100 antialiased" style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif" }}>
        <div className="pointer-events-none fixed inset-x-0 top-0 h-72 bg-gradient-to-b from-emerald-500/10 via-transparent to-transparent" />
        <header className="sticky top-0 z-30 border-b border-white/10 bg-zinc-950/80 backdrop-blur-xl" style={{ paddingTop: "env(safe-area-inset-top)" }}>
          <div className="mx-auto flex max-w-6xl items-center gap-2 px-4 py-3">
            <button onClick={() => setTab("ozet")} className="mr-auto flex items-center gap-2"><div className="grid h-8 w-8 place-items-center rounded-lg bg-emerald-400/15 text-emerald-300"><Wallet size={17} /></div>
              <span className="hidden text-[15px] font-semibold tracking-tight sm:inline">Nakit Akışı</span></button>
            {tab !== "ayar" && (
              <div className="flex items-center rounded-xl border border-white/10 bg-zinc-900/60">
                <button onClick={() => setYm(addM(ym, -1))} className="p-2.5 text-zinc-400 hover:text-white" aria-label="Önceki ay"><ChevronLeft size={16} /></button>
                <button onClick={() => setYm(todayStr().slice(0, 7))} className="min-w-[112px] px-1 text-center text-sm font-medium capitalize">{monthLabel(ym)}</button>
                <button onClick={() => setYm(addM(ym, 1))} className="p-2.5 text-zinc-400 hover:text-white" aria-label="Sonraki ay"><ChevronRight size={16} /></button>
              </div>)}
            <div className="ml-auto flex items-center gap-2">
              <button onClick={() => setPriv(!priv)} title="Gizlilik Modu" className={`rounded-xl border p-2.5 transition ${priv ? "border-emerald-400/40 bg-emerald-400/10 text-emerald-300" : "border-white/10 bg-zinc-900/60 text-zinc-400 hover:text-white"}`}>{priv ? <EyeOff size={17} /> : <Eye size={17} />}</button>
              <button onClick={exportJson} title="JSON İndir (Yedekle)" className="hidden items-center gap-1.5 rounded-xl border border-white/10 bg-zinc-900/60 px-2.5 py-2.5 text-xs text-zinc-300 hover:text-white sm:flex"><Download size={15} />Yedek</button>
              <button onClick={() => fileRef.current?.click()} title="JSON Yükle" className="hidden items-center gap-1.5 rounded-xl border border-white/10 bg-zinc-900/60 px-2.5 py-2.5 text-xs text-zinc-300 hover:text-white sm:flex"><Upload size={15} />Yükle</button>
              <button onClick={() => setTab("ayar")} title="Ayarlar" className={`rounded-xl border p-2.5 ${tab === "ayar" ? "border-white/30 bg-white/10 text-white" : "border-white/10 bg-zinc-900/60 text-zinc-400 hover:text-white"}`}><Settings size={17} /></button>
              <button onClick={() => setModal("new")} className="hidden items-center gap-1.5 rounded-xl bg-white px-3 py-2.5 text-sm font-semibold text-zinc-900 hover:bg-zinc-200 sm:flex"><Plus size={16} />İşlem</button>
            </div>
            <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={importJson} />
          </div>
          {/* Masaüstü sekmeleri */}
          <div className="mx-auto hidden max-w-6xl gap-1 px-4 pb-2 md:flex">
            {TABS.filter((t) => t[0] !== "ayar").map(([k, l, I]) => (<button key={k} onClick={() => setTab(k)} className={`flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm transition ${tab === k ? "bg-white/10 text-white" : "text-zinc-500 hover:text-zinc-200"}`}><I size={15} />{l}</button>))}
          </div>
        </header>

        <main className="relative mx-auto max-w-6xl px-4 pt-5" style={{ paddingBottom: "calc(110px + env(safe-area-inset-bottom))" }}>
          {content()}
          <div className="mt-6 px-1 text-xs text-zinc-600">Veriler yalnızca bu cihazın tarayıcısında saklanır. Düzenli yedek alın.</div>
        </main>

        {/* Mobil: yüzen + butonu ve alt sekme çubuğu */}
        <button onClick={() => setModal("new")} aria-label="İşlem ekle" className="fixed right-4 z-40 grid h-14 w-14 place-items-center rounded-full bg-white text-zinc-900 shadow-xl shadow-black/50 active:scale-95 sm:hidden" style={{ bottom: "calc(78px + env(safe-area-inset-bottom))" }}><Plus size={26} /></button>
        <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-white/10 bg-zinc-950/90 backdrop-blur-xl md:hidden" style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
          <div className="mx-auto grid max-w-md grid-cols-7">
            {TABS.filter((t) => t[0] !== "ayar").map(([k, l, I]) => (
              <button key={k} onClick={() => setTab(k)} className={`flex flex-col items-center gap-1 py-2.5 text-[10px] font-medium transition active:scale-95 ${tab === k ? "text-white" : "text-zinc-500"}`}>
                <span className={`grid h-7 w-11 place-items-center rounded-full transition ${tab === k ? "bg-white/10" : ""}`}><I size={19} /></span>{l}</button>))}
          </div>
        </nav>
        {modal && <AddModal key={modal === "new" ? "new" : modal.id} initial={modal === "new" ? null : modal} onClose={() => setModal(null)} onSave={save} onDelete={() => del(modal)} cards={cards} />}
        {cardModal && <CardModal key={cardModal === "new" ? "new" : cardModal.id} initial={cardModal === "new" ? null : cardModal} onClose={() => setCardModal(null)}
          onSave={(c) => { setCards((p) => (p.some((x) => x.id === c.id) ? p.map((x) => (x.id === c.id ? c : x)) : [...p, c])); setCardModal(null); }}
          onDelete={() => { if (window.confirm(`"${cardModal.name}" silinsin mi? Bu karta bağlı işlemler silinmez, yalnızca karttan ayrılır.`)) { setCards((p) => p.filter((x) => x.id !== cardModal.id)); setTxs((p) => p.map((t) => (t.cardId === cardModal.id ? { ...t, cardId: undefined } : t))); setCardModal(null); } }} />}
      </div>
      </CardsCtx.Provider>
    </PrivCtx.Provider>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
