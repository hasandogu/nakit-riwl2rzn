<head>

 "react": "https://esm.sh/react@18.3.1",

<body>
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import { createRoot } from "react-dom/client";
import React, { useState, useMemo, useEffect, useRef, useContext, createContext } from "react";
import {
  Eye, EyeOff, Download, Upload, Plus, Trash2, Search, ChevronLeft, ChevronRight, X,
  Wallet, TrendingUp, TrendingDown, PiggyBank, CreditCard, Repeat, Layers, Pencil,
  LayoutDashboard, Receipt, BarChart3, Target, Settings,
} from "lucide-react";
import {
  ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, PieChart, Pie, Cell,
} from "recharts";

/* ───────────── Sabitler ───────────── */
const KEY = "nakit-akisi-v1";
const EXP_CATS = ["Yemek & Market", "Kira / Faturalar", "Ulaşım", "Dijital Abonelikler", "Eğlence", "Eğitim / Donanım", "Diğer"];
const INC_CATS = ["Maaş / Burs", "Ek Gelir", "Diğer Gelir"];
const METHODS = ["Nakit", "Kredi Kartı", "Banka Hesabı"];
const CAT_COLOR = {
  "Yemek & Market": "#60a5fa", "Kira / Faturalar": "#a78bfa", "Ulaşım": "#22d3ee",
  "Dijital Abonelikler": "#f472b6", "Eğlence": "#fb923c", "Eğitim / Donanım": "#2dd4bf", "Diğer": "#94a3b8",
};
const MODES = { single: "Tek Çekim", installment: "Taksitli", recurring: "Her Ay Tekrarlayan" };

/* ───────────── Yardımcılar ───────────── */
const PrivCtx = createContext(false);
const pad = (n) => String(n).padStart(2, "0");
const fmt = (n) => new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 }).format(n || 0);
const fmt2 = (n) => new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }).format(n || 0);
const idx = (ym) => { const [y, m] = ym.split("-").map(Number); return y * 12 + m - 1; };
const addM = (ym, n) => { const i = idx(ym) + n; return `${Math.floor(i / 12)}-${pad((i % 12) + 1)}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const monthLabel = (ym) => new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 1).toLocaleDateString("tr-TR", { month: "long", year: "numeric" });
const monthShort = (ym) => new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 1).toLocaleDateString("tr-TR", { month: "short" });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayIn = (ym, day) => `${ym}-${pad(Math.min(day, new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate()))}`;

/** Bir işlemin seçilen aydaki gerçekleşmelerini döndürür (taksit / tekrar motoru). */
function occurrences(tx, ym) {
  const diff = idx(ym) - idx(tx.date.slice(0, 7));
  if (diff < 0) return [];
  if (tx.mode === "single") return diff === 0 ? [{ tx, amt: tx.amount }] : [];
  if (tx.mode === "installment") return diff < tx.installments ? [{ tx, amt: tx.amount / tx.installments, k: diff + 1, n: tx.installments }] : [];
  return [{ tx, amt: tx.amount }]; // recurring
}
const monthOcc = (txs, ym) => txs.flatMap((t) => occurrences(t, ym));
const sumBy = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

/* ───────────── Örnek veri ───────────── */
function buildSeed() {
  let s = 20260101;
  const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const between = (a, b) => Math.round(a + rnd() * (b - a));
  const now = todayStr(), cur = now.slice(0, 7), out = [];
  const add = (o) => { if (o.date <= now || o.mode !== "single") out.push({ id: uid(), mode: "single", installments: 1, ...o }); };
  add({ type: "income", title: "Maaş / Burs", amount: 45000, category: "Maaş / Burs", method: "Banka Hesabı", date: dayIn(addM(cur, -6), 1), mode: "recurring" });
  add({ type: "expense", title: "Ev kirası", amount: 14500, category: "Kira / Faturalar", method: "Banka Hesabı", date: dayIn(addM(cur, -6), 3), mode: "recurring" });
  add({ type: "expense", title: "İnternet", amount: 489.9, category: "Kira / Faturalar", method: "Kredi Kartı", date: dayIn(addM(cur, -6), 12), mode: "recurring" });
  add({ type: "expense", title: "Elektrik & Su", amount: 850, category: "Kira / Faturalar", method: "Banka Hesabı", date: dayIn(addM(cur, -6), 15), mode: "recurring" });
  [["Spotify", 99.99, 8], ["Netflix", 229.99, 10], ["Amazon Prime", 59, 21], ["iCloud", 39.99, 5]].forEach(([title, amount, d]) =>
    add({ type: "expense", title, amount, category: "Dijital Abonelikler", method: "Kredi Kartı", date: dayIn(addM(cur, -6), d), mode: "recurring" }));
  add({ type: "expense", title: "Dizüstü bilgisayar", amount: 54000, category: "Eğitim / Donanım", method: "Kredi Kartı", date: dayIn(addM(cur, -2), 14), mode: "installment", installments: 12 });
  add({ type: "expense", title: "Kablosuz kulaklık", amount: 7200, category: "Eğitim / Donanım", method: "Kredi Kartı", date: dayIn(addM(cur, -1), 9), mode: "installment", installments: 6 });
  [[-4, "Ek ders", 6500], [-2, "Freelance proje", 4000], [-1, "Freelance proje", 8200]].forEach(([m, title, amount]) =>
    add({ type: "income", title, amount, category: "Ek Gelir", method: "Banka Hesabı", date: dayIn(addM(cur, m), 18) }));
  for (let m = -6; m <= 0; m++) {
    const ym = addM(cur, m);
    [2, 9, 16, 23].forEach((d) => add({ type: "expense", title: ["Migros", "BİM", "A101", "Şok"][between(0, 3)], amount: between(280, 1150), category: "Yemek & Market", method: rnd() > 0.5 ? "Kredi Kartı" : "Banka Hesabı", date: dayIn(ym, d) }));
    [5, 19].forEach((d) => add({ type: "expense", title: ["Yemeksepeti", "Getir Yemek", "Trendyol Yemek"][between(0, 2)], amount: between(170, 430), category: "Yemek & Market", method: "Kredi Kartı", date: dayIn(ym, d) }));
    add({ type: "expense", title: "Toplu taşıma dolumu", amount: between(450, 700), category: "Ulaşım", method: "Nakit", date: dayIn(ym, 4) });
    add({ type: "expense", title: ["Sinema", "Konser bileti", "Arkadaşlarla akşam"][between(0, 2)], amount: between(250, 900), category: "Eğlence", method: "Kredi Kartı", date: dayIn(ym, between(20, 27)) });
    if (m === -3) add({ type: "expense", title: "Online kurs", amount: 1850, category: "Eğitim / Donanım", method: "Kredi Kartı", date: dayIn(ym, 11) });
  }
  return out;
}
function loadStore() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && Array.isArray(r.txs)) return r; } catch (e) {}
  return { txs: buildSeed(), budget: 32000, priv: false, catBudgets: {} };
}

/* ───────────── Küçük bileşenler ───────────── */
const Money = ({ v, d2, className = "" }) => {
  const priv = useContext(PrivCtx);
  return <span className={`tabular-nums transition ${priv ? "blur-sm select-none" : ""} ${className}`}>{d2 ? fmt2(v) : fmt(v)}</span>;
};
const Card = ({ className = "", children, onClick }) => (
  <div onClick={onClick} role={onClick ? "button" : undefined} tabIndex={onClick ? 0 : undefined}
    className={`rounded-2xl border border-white/10 bg-zinc-900/60 backdrop-blur-md p-5 ${onClick ? "cursor-pointer transition hover:border-white/25 active:scale-[0.99]" : ""} ${className}`}>{children}</div>
);
const Go = () => <ChevronRight size={15} className="text-zinc-600" />;
const Label = ({ icon: I, children, tone = "text-zinc-400" }) => (
  <div className={`flex items-center gap-2 text-xs font-medium uppercase tracking-wider ${tone}`}>{I && <I size={14} />}{children}</div>
);
const inputCls = "w-full rounded-xl bg-zinc-900 border border-white/10 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-white/30 placeholder:text-zinc-600";
const ChartTip = ({ active, payload, label }) => {
  const priv = useContext(PrivCtx);
  if (!active || !payload?.length) return null;
  return (
    <div className="rounded-xl border border-white/10 bg-zinc-950/95 px-3 py-2 text-xs shadow-xl">
      <div className="mb-1 text-zinc-400">{label}</div>
      {payload.map((p) => <div key={p.dataKey} style={{ color: p.color || p.fill }} className={priv ? "blur-sm" : ""}>{p.name}: {fmt(p.value)}</div>)}
    </div>
  );
};

/* ───────────── İşlem ekleme penceresi ───────────── */
function AddModal({ onClose, onSave, onDelete, initial }) {
  const [f, setF] = useState(initial ? { ...initial, amount: String(initial.amount) } : { type: "expense", title: "", amount: "", category: EXP_CATS[0], method: METHODS[1], date: todayStr(), mode: "single", installments: 3 });
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const setType = (t) => setF((p) => ({ ...p, type: t, category: t === "income" ? INC_CATS[0] : EXP_CATS[0], mode: t === "income" && p.mode === "installment" ? "single" : p.mode }));
  const valid = f.title.trim() && +f.amount > 0 && f.date;
  useEffect(() => { const h = (e) => e.key === "Escape" && onClose(); window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [onClose]);
  const submit = (e) => {
    e.preventDefault(); if (!valid) return;
    onSave({ id: initial?.id || uid(), type: f.type, title: f.title.trim(), amount: +f.amount, category: f.category, method: f.method, date: f.date, mode: f.mode, installments: f.mode === "installment" ? +f.installments : 1 });
  };
  const per = f.mode === "installment" && +f.amount > 0 ? +f.amount / +f.installments : 0;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-0 sm:p-4" onClick={onClose}>
      <form onSubmit={submit} onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md max-h-[92vh] overflow-auto rounded-t-3xl sm:rounded-3xl border border-white/10 bg-zinc-950 p-5 shadow-2xl">
        <div className="mb-4 flex items-center justify-between"><h2 className="text-lg font-semibold">{initial ? "İşlemi Düzenle" : "Yeni İşlem"}</h2>
          <button type="button" onClick={onClose} className="rounded-lg p-1.5 text-zinc-400 hover:bg-white/10"><X size={18} /></button></div>
        <div className="mb-4 grid grid-cols-2 gap-1 rounded-xl bg-zinc-900 p-1">
          {[["expense", "Gider", "bg-rose-400/20 text-rose-300"], ["income", "Gelir", "bg-emerald-400/20 text-emerald-300"]].map(([t, l, c]) => (
            <button key={t} type="button" onClick={() => setType(t)} className={`rounded-lg py-2 text-sm font-medium transition ${f.type === t ? c : "text-zinc-500"}`}>{l}</button>))}
        </div>
        <div className="space-y-3">
          <input autoFocus className={inputCls} placeholder="Açıklama (örn. Migros, Kira)" value={f.title} onChange={(e) => set("title", e.target.value)} />
          <div className="grid grid-cols-2 gap-3">
            <input className={inputCls} type="number" inputMode="decimal" step="0.01" min="0" placeholder={f.mode === "installment" ? "Toplam tutar ₺" : "Tutar ₺"} value={f.amount} onChange={(e) => set("amount", e.target.value)} />
            <input className={inputCls} type="date" value={f.date} onChange={(e) => set("date", e.target.value)} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <select className={inputCls} value={f.category} onChange={(e) => set("category", e.target.value)}>{(f.type === "income" ? INC_CATS : EXP_CATS).map((c) => <option key={c}>{c}</option>)}</select>
            <select className={inputCls} value={f.method} onChange={(e) => set("method", e.target.value)}>{METHODS.map((c) => <option key={c}>{c}</option>)}</select>
          </div>
          <div>
            <div className="mb-1.5 text-xs text-zinc-500">Ödeme şekli</div>
            <div className={`grid gap-1 rounded-xl bg-zinc-900 p-1 ${f.type === "income" ? "grid-cols-2" : "grid-cols-3"}`}>
              {Object.entries(MODES).filter(([k]) => f.type === "expense" || k !== "installment").map(([k, l]) => (
                <button key={k} type="button" onClick={() => set("mode", k)} className={`rounded-lg px-1 py-2 text-xs font-medium transition ${f.mode === k ? (k === "recurring" ? "bg-amber-400/20 text-amber-300" : "bg-white/10 text-white") : "text-zinc-500"}`}>{l}</button>))}
            </div>
          </div>
          {f.mode === "installment" && (
            <div className="rounded-xl border border-white/10 bg-zinc-900/60 p-3">
              <div className="mb-2 flex flex-wrap gap-1.5">
                {[2, 3, 6, 9, 12, 18, 24].map((n) => (
                  <button key={n} type="button" onClick={() => set("installments", n)} className={`rounded-lg px-3 py-1.5 text-xs font-medium ${+f.installments === n ? "bg-white text-zinc-900" : "bg-zinc-800 text-zinc-400"}`}>{n}x</button>))}
              </div>
              <div className="text-xs text-zinc-400">{+f.installments} taksit{per > 0 && <> · aylık <span className="font-semibold text-zinc-200">{fmt2(per)}</span></>}</div>
            </div>)}
          {f.mode === "recurring" && <div className="rounded-xl border border-amber-400/20 bg-amber-400/5 p-3 text-xs text-amber-200/80">Bu işlem seçilen tarihten itibaren her ay otomatik olarak yansır.</div>}
        </div>
        {initial && f.mode !== "single" && <div className="mt-3 text-xs text-zinc-500">Değişiklik serinin tüm aylarına uygulanır.</div>}
        <button disabled={!valid} className="mt-5 w-full rounded-xl bg-white py-2.5 text-sm font-semibold text-zinc-900 transition hover:bg-zinc-200 disabled:opacity-30">Kaydet</button>
        {initial && <button type="button" onClick={onDelete} className="mt-2 w-full rounded-xl border border-rose-400/30 py-2.5 text-sm font-medium text-rose-300 hover:bg-rose-400/10">Sil</button>}
      </form>
    </div>
  );
}

/* ───────────── Ana uygulama ───────────── */
const TABS = [
  ["ozet", "Özet", LayoutDashboard], ["islemler", "İşlemler", Receipt], ["taksit", "Taksit", Layers],
  ["sabit", "Sabit", Repeat], ["analiz", "Analiz", BarChart3], ["butce", "Bütçe", Target], ["ayar", "Ayarlar", Settings],
];
const hashTab = () => { const h = (window.location.hash || "").replace("#/", ""); return TABS.some((t) => t[0] === h) ? h : "ozet"; };

const TxRow = ({ r, onOpen, onDel }) => {
  const t = r.tx, isInc = t.type === "income";
  return (
    <div onClick={() => onOpen(t)} className="group flex cursor-pointer items-center gap-3 border-t border-white/5 px-4 py-3 transition hover:bg-white/[0.04] active:bg-white/[0.07]">
      <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl" style={{ background: isInc ? "rgba(52,211,153,.15)" : (CAT_COLOR[t.category] || "#94a3b8") + "26" }}>
        {isInc ? <TrendingUp size={16} className="text-emerald-400" /> : t.mode === "installment" ? <Layers size={16} className="text-violet-300" /> : t.mode === "recurring" ? <Repeat size={16} className="text-amber-400" /> : t.method === "Kredi Kartı" ? <CreditCard size={16} style={{ color: CAT_COLOR[t.category] }} /> : <Wallet size={16} style={{ color: CAT_COLOR[t.category] }} />}</span>
      <div className="min-w-0 flex-1">
        <div className="flex items-center gap-2"><span className="truncate text-sm font-medium">{t.title}</span>
          {t.mode === "installment" && <span className="shrink-0 rounded-md bg-violet-400/15 px-1.5 py-0.5 text-[10px] font-medium text-violet-300">{r.all ? `${t.installments} taksit` : `${r.k}/${r.n}`}</span>}
          {t.mode === "recurring" && <span className="shrink-0 rounded-md bg-amber-400/15 px-1.5 py-0.5 text-[10px] font-medium text-amber-300">Her ay</span>}</div>
        <div className="truncate text-xs text-zinc-500">{t.category} · {t.method}</div>
      </div>
      <div className="text-right">
        <div className={`text-sm font-semibold ${isInc ? "text-emerald-400" : "text-rose-400"}`}>{isInc ? "+" : "−"}<Money v={r.amt} d2 /></div>
        {t.mode === "installment" && r.all && <div className="text-[11px] text-zinc-600">toplam</div>}
      </div>
      <button onClick={(e) => { e.stopPropagation(); onDel(t); }} className="rounded-lg p-2 text-zinc-600 transition hover:bg-rose-400/10 hover:text-rose-400" title="Sil"><Trash2 size={15} /></button>
    </div>
  );
};

function App() {
  const init = useMemo(loadStore, []);
  const [txs, setTxs] = useState(init.txs);
  const [budget, setBudget] = useState(init.budget ?? 32000);
  const [catBudgets, setCatBudgets] = useState(init.catBudgets || {});
  const [priv, setPriv] = useState(!!init.priv);
  const [ym, setYm] = useState(todayStr().slice(0, 7));
  const [tab, setTabRaw] = useState(hashTab);
  const [modal, setModal] = useState(null); // null | "new" | tx
  const [q, setQ] = useState("");
  const [fCat, setFCat] = useState("Tümü");
  const [fMethod, setFMethod] = useState("Tümü");
  const [allMonths, setAllMonths] = useState(false);
  const [editBudget, setEditBudget] = useState(false);
  const fileRef = useRef(null);

  const setTab = (t) => { setTabRaw(t); try { window.history.replaceState(null, "", "#/" + t); } catch (e) {} window.scrollTo(0, 0); };
  const goTo = (t, o = {}) => { if (o.cat !== undefined) { setFCat(o.cat); setAllMonths(false); setQ(""); setFMethod("Tümü"); } setTab(t); };
  useEffect(() => { localStorage.setItem(KEY, JSON.stringify({ txs, budget, priv, catBudgets })); }, [txs, budget, priv, catBudgets]);
  useEffect(() => { const h = () => setTabRaw(hashTab()); window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);

  /* hesaplamalar */
  const occ = useMemo(() => monthOcc(txs, ym), [txs, ym]);
  const expOcc = occ.filter((o) => o.tx.type === "expense");
  const inc = sumBy(occ.filter((o) => o.tx.type === "income"), (o) => o.amt);
  const exp = sumBy(expOcc, (o) => o.amt);
  const net = inc - exp;
  const saveRate = inc > 0 ? (net / inc) * 100 : 0;
  const remaining = budget - exp;
  const usedPct = budget > 0 ? Math.min(100, (exp / budget) * 100) : 0;
  const catSum = (list) => { const m = {}; list.forEach((o) => { m[o.tx.category] = (m[o.tx.category] || 0) + o.amt; }); return m; };
  const catNow = useMemo(() => catSum(expOcc), [occ]);
  const catPrev = useMemo(() => catSum(monthOcc(txs, addM(ym, -1)).filter((o) => o.tx.type === "expense")), [txs, ym]);
  const pie = Object.entries(catNow).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);

  const monthsBack = (n) => Array.from({ length: n }, (_, i) => addM(ym, i - (n - 1)));
  const series = (n) => monthsBack(n).map((m) => { const o = monthOcc(txs, m); const g = sumBy(o.filter((x) => x.tx.type === "income"), (x) => x.amt), d = sumBy(o.filter((x) => x.tx.type === "expense"), (x) => x.amt); return { name: monthShort(m), Gelir: Math.round(g), Gider: Math.round(d), Net: Math.round(g - d) }; });
  const six = useMemo(() => series(6), [txs, ym]);
  const twelve = useMemo(() => series(12), [txs, ym]);

  const instAll = txs.filter((t) => t.type === "expense" && t.mode === "installment");
  const instInfo = instAll.map((t) => {
    const start = t.date.slice(0, 7), per = t.amount / t.installments;
    const paid = Math.min(t.installments, Math.max(0, idx(ym) - idx(start) + 1));
    return { t, per, paid, left: t.installments - paid, remain: per * (t.installments - paid), end: addM(start, t.installments - 1), started: idx(ym) >= idx(start) };
  });
  const activeInst = instInfo.filter((x) => x.left > 0);
  const totalDebt = sumBy(activeInst, (x) => x.remain);
  const thisMonthInst = sumBy(monthOcc(instAll, ym), (x) => x.amt);
  const future = (n, from) => Array.from({ length: n }, (_, i) => { const m = addM(ym, i + from); return { name: monthShort(m), Taksit: Math.round(sumBy(monthOcc(instAll, m), (x) => x.amt)) }; });
  const future6 = useMemo(() => future(6, 1), [txs, ym]);
  const future12 = useMemo(() => future(12, 0), [txs, ym]);

  const fixedExp = expOcc.filter((o) => o.tx.mode === "recurring");
  const fixedInc = occ.filter((o) => o.tx.type === "income" && o.tx.mode === "recurring");
  const fixedTotal = sumBy(fixedExp, (o) => o.amt), fixedIncTotal = sumBy(fixedInc, (o) => o.amt);

  const rows = useMemo(() => {

            <input type="number" inputMode="decimal" placeholder="Limit ₺" defaultValue={lim || ""} onBlur={(e) => setCatBudgets((p0) => ({ ...p0, [c]: Math.max(0, +e.target.value || 0) }))} className="w-28 rounded-lg border border-white/10 bg-zinc-900 px-2 py-1.5 text-right text-sm outline-none focus:border-white/30" /></div>
            <div className="mt-2 h-2 overflow-hidden rounded-full bg-white/10"><div className={`h-full rounded-full ${p >= 100 ? "bg-rose-400" : p >= 80 ? "bg-amber-400" : "bg-emerald-400"}`} style={{ width: `${Math.min(100, lim ? p : 0)}%` }} /></div>
            <div className="mt-1 flex justify-between text-xs text-zinc-500"><span>Harcanan <Money v={spent} /></span><span>{lim > 0 ? (p >= 100 ? <span className="text-rose-400">Limit aşıldı</span> : <>Kalan <Money v={lim - spent} /></>) : "Limit yok"}</span></div></div>);
        })}</div></Card>
    </div>
  );

  const Ayar = () => (
    <div className="space-y-4">
      <Card><Label>Yedekleme</Label><div className="mt-1 text-xs text-zinc-500">Veriler yalnızca bu cihazda saklanır. Haftada bir yedek alın.</div>
        <div className="mt-4 grid grid-cols-2 gap-3">
          <button onClick={exportJson} className="flex items-center justify-center gap-2 rounded-xl bg-white py-3 text-sm font-semibold text-zinc-900"><Download size={16} />JSON İndir</button>
          <button onClick={() => fileRef.current?.click()} className="flex items-center justify-center gap-2 rounded-xl border border-white/15 py-3 text-sm font-medium"><Upload size={16} />JSON Yükle</button></div></Card>
      <Card><Label>Gizlilik Modu</Label>
        <button onClick={() => setPriv(!priv)} className="mt-3 flex w-full items-center justify-between rounded-xl border border-white/10 px-4 py-3 text-sm"><span className="flex items-center gap-2">{priv ? <EyeOff size={16} /> : <Eye size={16} />}Rakamları bulanıklaştır</span>
          <span className={`rounded-full px-2.5 py-0.5 text-xs ${priv ? "bg-emerald-400/20 text-emerald-300" : "bg-white/10 text-zinc-400"}`}>{priv ? "Açık" : "Kapalı"}</span></button></Card>
      <Card><Label>Veri</Label>
        <div className="mt-3 space-y-2"><button onClick={loadSample} className="w-full rounded-xl border border-white/10 py-3 text-sm text-zinc-300">Örnek verileri yükle</button>
          <button onClick={clearAll} className="w-full rounded-xl border border-rose-400/30 py-3 text-sm text-rose-300">Tüm verileri sil</button></div>
        <div className="mt-3 text-xs text-zinc-600">{txs.length} kayıt · veriler bu cihazın tarayıcısında saklanır.</div></Card>
    </div>
  );

  const content = { ozet: Ozet, islemler: Islemler, taksit: Taksit, sabit: Sabit, analiz: Analiz, butce: Butce, ayar: Ayar }[tab];

  return (
    <PrivCtx.Provider value={priv}>
      <div className="min-h-screen bg-zinc-950 text-zinc-100 antialiased" style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif" }}>
        <div className="pointer-events-none fixed inset-x-0 top-0 h-72 bg-gradient-to-b from-emerald-500/10 via-transparent to-transparent" />
        <header className="sticky top-0 z-30 border-b border-white/10 bg-zinc-950/80 backdrop-blur-xl" style={{ paddingTop: "env(safe-area-inset-top)" }}>
          <div className="mx-auto flex max-w-6xl items-center gap-2 px-4 py-3">
            <button onClick={() => setTab("ozet")} className="mr-auto flex items-center gap-2"><div className="grid h-8 w-8 place-items-center rounded-lg bg-emerald-400/15 text-emerald-300"><Wallet size={17} /></div>
              <span className="hidden text-[15px] font-semibold tracking-tight sm:inline">Nakit Akışı</span></button>
            {tab !== "ayar" && (
              <div className="flex items-center rounded-xl border border-white/10 bg-zinc-900/60">
                <button onClick={() => setYm(addM(ym, -1))} className="p-2.5 text-zinc-400 hover:text-white" aria-label="Önceki ay"><ChevronLeft size={16} /></button>
                <button onClick={() => setYm(todayStr().slice(0, 7))} className="min-w-[112px] px-1 text-center text-sm font-medium capitalize">{monthLabel(ym)}</button>
                <button onClick={() => setYm(addM(ym, 1))} className="p-2.5 text-zinc-400 hover:text-white" aria-label="Sonraki ay"><ChevronRight size={16} /></button>
              </div>)}
            <div className="ml-auto flex items-center gap-2">
              <button onClick={() => setPriv(!priv)} title="Gizlilik Modu" className={`rounded-xl border p-2.5 transition ${priv ? "border-emerald-400/40 bg-emerald-400/10 text-emerald-300" : "border-white/10 bg-zinc-900/60 text-zinc-400 hover:text-white"}`}>{priv ? <EyeOff size={17} /> : <Eye size={17} />}</button>
              <button onClick={exportJson} title="JSON İndir (Yedekle)" className="hidden items-center gap-1.5 rounded-xl border border-white/10 bg-zinc-900/60 px-2.5 py-2.5 text-xs text-zinc-300 hover:text-white sm:flex"><Download size={15} />JSON İndir</button>
              <button onClick={() => fileRef.current?.click()} title="JSON Yükle" className="hidden items-center gap-1.5 rounded-xl border border-white/10 bg-zinc-900/60 px-2.5 py-2.5 text-xs text-zinc-300 hover:text-white sm:flex"><Upload size={15} />JSON Yükle</button>
              <button onClick={() => setTab("ayar")} title="Ayarlar" className={`rounded-xl border p-2.5 ${tab === "ayar" ? "border-white/30 bg-white/10 text-white" : "border-white/10 bg-zinc-900/60 text-zinc-400 hover:text-white"}`}><Settings size={17} /></button>
              <button onClick={() => setModal("new")} className="hidden items-center gap-1.5 rounded-xl bg-white px-3 py-2.5 text-sm font-semibold text-zinc-900 hover:bg-zinc-200 sm:flex"><Plus size={16} />İşlem</button>
            </div>
            <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={importJson} />
          </div>
          {/* Masaüstü sekmeleri */}
          <div className="mx-auto hidden max-w-6xl gap-1 px-4 pb-2 md:flex">
            {TABS.slice(0, 6).map(([k, l, I]) => (<button key={k} onClick={() => setTab(k)} className={`flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm transition ${tab === k ? "bg-white/10 text-white" : "text-zinc-500 hover:text-zinc-200"}`}><I size={15} />{l}</button>))}
          </div>
        </header>

        <main className="relative mx-auto max-w-6xl px-4 pt-5" style={{ paddingBottom: "calc(110px + env(safe-area-inset-bottom))" }}>
          {content()}
          <div className="mt-6 px-1 text-xs text-zinc-600">Veriler yalnızca bu cihazın tarayıcısında saklanır. Düzenli yedek alın.</div>
        </main>

        {/* Mobil: yüzen + butonu ve alt sekme çubuğu */}
        <button onClick={() => setModal("new")} aria-label="İşlem ekle" className="fixed right-4 z-40 grid h-14 w-14 place-items-center rounded-full bg-white text-zinc-900 shadow-xl shadow-black/50 active:scale-95 sm:hidden" style={{ bottom: "calc(78px + env(safe-area-inset-bottom))" }}><Plus size={26} /></button>
        <nav className="fixed inset-x-0 bottom-0 z-40 border-t border-white/10 bg-zinc-950/90 backdrop-blur-xl md:hidden" style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
          <div className="mx-auto grid max-w-md grid-cols-6">
            {TABS.slice(0, 6).map(([k, l, I]) => (
              <button key={k} onClick={() => setTab(k)} className={`flex flex-col items-center gap-1 py-2.5 text-[10px] font-medium transition active:scale-95 ${tab === k ? "text-white" : "text-zinc-500"}`}>
                <span className={`grid h-7 w-11 place-items-center rounded-full transition ${tab === k ? "bg-white/10" : ""}`}><I size={19} /></span>{l}</button>))}
          </div>
        </nav>
        {modal && <AddModal key={modal === "new" ? "new" : modal.id} initial={modal === "new" ? null : modal} onClose={() => setModal(null)} onSave={save} onDelete={() => del(modal)} />}
      </div>
    </PrivCtx.Provider>
  );
}

createRoot(document.getElementById("root")).render(<App />);

</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
